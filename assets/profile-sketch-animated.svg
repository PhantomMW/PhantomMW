<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600">
<defs>
<clipPath id="draw"><rect x="0" y="0" width="300" height="0"><animate attributeName="height" from="0" to="300" dur="5s" begin="0s" fill="freeze"/></rect></clipPath>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#7ee787" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="300" height="300" rx="12" fill="#0D1117"/>
<g clip-path="url(#draw)"><image x="0" y="0" width="300" height="300" href="data:image/jpeg;base64,"/></g>
<rect x="0" y="0" width="300" height="300" rx="12" fill="none" stroke="#30363D"/>
<rect x="9" y="0" width="282" height="2" fill="url(#scan)"><animate attributeName="y" from="0" to="298" dur="5s" begin="0s" fill="freeze"/></rect>
</svg>