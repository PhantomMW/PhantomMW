<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="sketch" x="-20%" y="-20%" width="140%" height="140%">
      <feColorMatrix type="saturate" values="0"/>
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feConvolveMatrix in="blur" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" result="edges"/>
      <feComponentTransfer in="edges">
        <feFuncR type="linear" slope="1.5" intercept="0.05"/>
        <feFuncG type="linear" slope="1.5" intercept="0.05"/>
        <feFuncB type="linear" slope="1.5" intercept="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.75  0 0 0 0 0.95  0 0 0 1 0"/>
    </filter>
    <clipPath id="draw">
      <rect x="0" y="0" width="600" height="0">
        <animate attributeName="height" from="0" to="600" dur="4.5s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="600" height="600" rx="18" fill="#0D1117"/>
  <g clip-path="url(#draw)">
    <image x="35" y="35" width="530" height="530" preserveAspectRatio="xMidYMid slice"
      xlink:href="https://github.com/PhantomMW.png?size=600" filter="url(#sketch)"/>
    <image x="35" y="35" width="530" height="530" preserveAspectRatio="xMidYMid slice"
      xlink:href="https://github.com/PhantomMW.png?size=600" filter="url(#sketch)" opacity="0.9"/>
  </g>
  <rect x="0" y="0" width="600" height="600" rx="18" fill="none" stroke="#30363D"/>
</svg>