<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120">
<defs>
<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8B949E"/><stop offset="50%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#C9D1D9"/>
</linearGradient>
</defs>
<style>
.wave{transform-box:fill-box;transform-origin:50% 90%;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(18deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(16deg)}80%{transform:rotate(-4deg)}}
.txt{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:url(#g)}
</style>
<g>
<text x="155" y="78" font-size="55" class="wave">👋</text>
<text x="235" y="76" class="txt">Hi Everyone, I'm Mohammed!</text>
</g>
</svg>